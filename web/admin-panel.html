<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link rel="stylesheet" href="main-styles.css">
</head>

<body>
    <div class="container" style="max-width: 1000px;">
        <nav>
            <a href="catalog.html">Каталог</a>
            <a href="my-bookings.html">Мои брони</a>
            <a href="admin-panel.html">Админка</a>
            <a href="#" onclick="logout()" style="margin-left: auto;">Выйти</a>
        </nav>

        <h1>Все бронирования (Админ)</h1>

        <div class="form-group" style="max-width: 300px;">
            <label>Фильтр по статусу</label>
            <select id="filter-status" onchange="loadAll()">
                <option value="">Все статусы</option>
                <option value="active">Активные</option>
                <option value="cancelled">Отмененные</option>
            </select>
        </div>

        <!-- Сетка для карточек -->
        <div id="list" class="bookings-grid">
            <p>Загрузка...</p>
        </div>

        <hr style="margin: 30px 0;">

        <h2>Журнал аудита</h2>
        <div id="audit-list" class="bookings-grid">
            <p>Загрузка...</p>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');

        // Проверка на админа
        if (!token || role !== 'admin') {
            alert('Доступ только для администратора');
            window.location.href = 'catalog.html';
        }

        function logout() { localStorage.clear(); window.location.href = 'auth.html'; }

        // 1. Загрузка всех броней
        async function loadAll() {
            const filter = document.getElementById('filter-status').value;
            const list = document.getElementById('list');
            list.innerHTML = '<p>Загрузка...</p>';

            try {
                const url = `/api/admin/bookings${filter ? '?status=' + filter : ''}`;
                const res = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 401) { logout(); return; }
                if (res.status === 403) {
                    list.innerHTML = '<p class="error">Доступ запрещен (вы не админ)</p>';
                    return;
                }

                const data = await res.json();

                if (data.length === 0) {
                    list.innerHTML = '<p>Броней не найдено.</p>';
                    return;
                }

                list.innerHTML = data.map(b => {
                    const st = new Date(b.start_time).toLocaleString('ru-RU', { timeZone: 'Europe/Moscow' });
                    const en = new Date(b.end_time).toLocaleTimeString('ru-RU', { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit' });

                    const badgeClass = b.status === 'active' ? 'badge-active' : 'badge-cancelled';
                    const statusText = b.status === 'active' ? 'Активна' : 'Отменена';

                    return `
                        <div class="card" style="display: flex; flex-direction: column; justify-content: space-between;">
                            <div>
                                <h3>${b.resource_name}</h3>
                                <p><strong>Пользователь:</strong> ${b.username || 'Неизвестно'}</p>
                                <p><strong>Время:</strong> ${st} - ${en} (МСК)</p>
                                <p><strong>Цель:</strong> ${b.purpose}</p>
                                <p><strong>Статус:</strong> <span class="badge ${badgeClass}">${statusText}</span></p>
                                ${b.cancellation_reason ? `<p><strong>Причина:</strong> ${b.cancellation_reason}</p>` : ''}
                            </div>
                            ${b.status === 'active'
                            ? `<button onclick="cancelAdmin(${b.id})" class="btn-cancel">Отменить с причиной</button>`
                            : ''}
                        </div>
                    `;
                }).join('');
            } catch (e) {
                list.innerHTML = '<p class="error">Ошибка загрузки. Проверьте, запущен ли сервер.</p>';
            }
        }

        // 2. Отмена брони админом
        async function cancelAdmin(id) {
            const reason = prompt('Укажите причину отмены брони (обязательно):');
            if (!reason || reason.trim() === '') return alert('Причина обязательна');

            try {
                const res = await fetch(`/api/admin/bookings/${id}/cancel`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ reason })
                });

                if (res.ok) {
                    alert('Бронь отменена администратором');
                    loadAll(); // Обновляем список
                    loadAudit(); // Обновляем аудит
                } else {
                    const d = await res.json();
                    alert(d.error || 'Ошибка отмены');
                }
            } catch (e) {
                alert('Ошибка сети');
            }
        }

        // 3. Загрузка аудита
        async function loadAudit() {
            const list = document.getElementById('audit-list');
            try {
                const res = await fetch('/api/admin/audit', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) throw new Error('Ошибка');

                const data = await res.json();
                if (data.length === 0) {
                    list.innerHTML = '<p>Записей нет.</p>';
                    return;
                }

                list.innerHTML = data.map(a => `
                    <div class="card" style="padding: 15px; font-size: 14px;">
                        <p><strong>${new Date(a.created_at).toLocaleString('ru-RU')}</strong> — ${a.username || 'Система'}</p>
                        <p>Действие: <strong>${a.action}</strong> (${a.entity_type} #${a.entity_id})</p>
                        <p style="color:#64748b;">${a.details || ''}</p>
                    </div>
                `).join('');
            } catch (e) {
                list.innerHTML = '<p class="error">Ошибка загрузки аудита</p>';
            }
        }

        // Запускаем всё при загрузке
        loadAll();
        loadAudit();
    </script>
</body>

</html>
